mode: paper  # paper | live

market:
  asset: btc
  period: 5m

signals:
  oracle_lag:
    max_expected_lag: 0.001
    weight_early: 0.35
    weight_late: 0.25
  momentum:
    roc_weight: 0.30
    direction_weight: 0.25
    volume_weight: 0.25
    body_ratio_weight: 0.10
    rsi_weight: 0.10
    rsi_period: 5
    lookback_candles: 10
    weight_early: 0.40
    weight_late: 0.65
  liquidation:
    weight_early: 0.25
    weight_late: 0.10
    refresh_interval_sec: 60
  max_adjustment: 0.20     # Raised from 0.15: lets strong multi-layer agreement express conviction

entry:
  # Dynamic first-signal entry (backtest: 8,256 trades, 67.5% WR, $1,045 total PnL)
  # Scans from 4:30 to 1:00 — enters at first signal above threshold
  # Beats fixed 4m entry by $289 (captures extra windows where signal strengthens late)
  min_edge: 0.003          # Floor: still requires +EV after fees
  max_edge: 0.025          # Flat curve: 0.025@270s, 0.017@180s, 0.008@60s
  fee_adjustment: 0.02     # Realistic Polymarket fee (~2%)
  min_confidence: 0.02     # Minimum signal confidence to trade (validated over 7,600 trades)
  preferred_entry_secs: 180  # Target 3min remaining (sweet spot)
  latest_entry_secs: 60    # Don't enter after 1min remaining (market too efficient)
  earliest_entry_secs: 270  # Start scanning at 4:30 (dynamic first-signal entry)
  gtc_timeout_sec: 10
  fok_slippage: 0.005

sizing:
  kelly_multiplier: 0.25
  min_bet_usdc: 1.0
  max_bet_usdc: 5.0
  initial_bankroll: 100.0

risk:
  daily_loss_cap_pct: 0.20
  daily_loss_warn_pct: 0.15
  min_bankroll: 10.0
  streak_reduce_at: 3
  streak_reduce_factor: 0.75
  streak_heavy_reduce_at: 5
  streak_heavy_reduce_factor: 0.5
  streak_pause_at: 7
  streak_pause_minutes: 30
  streak_reset_wins: 3
  low_volatility_threshold: 0.0001
  high_volatility_threshold: 0.02
  high_volatility_size_factor: 0.5

regime:
  detector: mtf
  trend_threshold: 0.30
  high_vol_percentile: 0.90
  low_vol_percentile: 0.20
  alignment_weight: 0.55
  stickiness: 3
  allowed_regimes: [trending_up, trending_down, ranging]
  block_regimes: [high_vol, low_vol]

sm_confirmation:
  enabled: false                 # L9: SM wallet confirmation layer (Phase 4)
  check_minutes: [3, 4]          # Minutes within window to check SM flow
  agreement_threshold: 0.60      # 60%+ SM dollars on same side = agreement
  min_volume: 100.0              # Minimum SM dollar flow to act on
  min_wallets: 2                 # Minimum distinct SM wallets required
  price_floor: 0.65              # Below this, SM signal is noise — IGNORE
  price_ceiling: 0.80            # Above this, market already decided — IGNORE
  poll_interval: 3.0             # Seconds between Polygon RPC polls

telegram:
  enabled: true
  notify_every_trade: true
  notify_daily_summary: true
  paper_prefix: "[PAPER] "

logging:
  db_path: ./data_runtime/trades.db
  signal_log_path: ./data_runtime/signals.csv
  log_level: INFO

# Independent kill switch + watchdog (ADR-0002). See docs/KILL_SWITCH_PLAN.md.
kill_switch:
  watchdog_poll_secs: 2       # how often the watchdog checks the heartbeat
  staleness_secs: 20          # heartbeat age beyond this counts as stale
  stale_checks_to_fire: 3     # consecutive stale checks before firing (~26s)
  flatten_guard_secs: 60      # closer than this to resolution -> let it resolve
  flatten_max_retries: 4      # aggressive-sell attempts per position
