mode: paper  # paper | live

market:
  asset: btc
  period: 5m

signals:
  oracle_lag:
    max_expected_lag: 0.001
    weight_early: 0.35
    weight_late: 0.25
  momentum:
    roc_weight: 0.30
    direction_weight: 0.25
    volume_weight: 0.25
    body_ratio_weight: 0.10
    rsi_weight: 0.10
    rsi_period: 5
    lookback_candles: 10
    weight_early: 0.40
    weight_late: 0.65
  liquidation:
    weight_early: 0.25
    weight_late: 0.10
    refresh_interval_sec: 60
  max_adjustment: 0.15

entry:
  # Optimised from unified backtest (544 trades, 69.5% WR)
  # Best strategy: 3min entry, >=3% confidence → 78.4% WR, $0.082/trade
  min_edge: 0.015          # Lowered: backtest shows edge exists at lower thresholds
  max_edge: 0.08           # Reduced: no need to demand huge edge early
  fee_adjustment: 0.02     # Raised: realistic Polymarket fee (~2%)
  min_confidence: 0.03     # NEW: minimum signal confidence to trade (from backtest)
  preferred_entry_secs: 180  # NEW: target entry at 3min remaining (sweet spot)
  latest_entry_secs: 60    # NEW: don't enter after 1min remaining (market too efficient)
  gtc_timeout_sec: 10
  fok_slippage: 0.005

sizing:
  kelly_multiplier: 0.25
  min_bet_usdc: 1.0
  max_bet_usdc: 5.0
  initial_bankroll: 100.0

risk:
  daily_loss_cap_pct: 0.20
  daily_loss_warn_pct: 0.15
  min_bankroll: 10.0
  streak_reduce_at: 3
  streak_reduce_factor: 0.75
  streak_heavy_reduce_at: 5
  streak_heavy_reduce_factor: 0.5
  streak_pause_at: 7
  streak_pause_minutes: 30
  streak_reset_wins: 3
  low_volatility_threshold: 0.0001
  high_volatility_threshold: 0.02
  high_volatility_size_factor: 0.5

telegram:
  enabled: true
  notify_every_trade: true
  notify_daily_summary: true
  paper_prefix: "[PAPER] "

logging:
  db_path: ./data_runtime/trades.db
  signal_log_path: ./data_runtime/signals.csv
  log_level: INFO
