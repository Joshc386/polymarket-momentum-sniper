# Multi-Bot Runner Configuration
# Run with: python multi_runner.py

mode: paper

market:
  asset: btc
  period: 5m

# Shared data feed config
coinalyze:
  refresh_interval: 60

liquidation:
  refresh_interval_sec: 60

telegram:
  enabled: true
  notify_every_trade: true
  paper_prefix: "[MULTI] "

logging:
  log_level: INFO

# ======================================================================
#  BOT DEFINITIONS
#  Each bot gets its own signals, entry logic, sizing, risk, and DB.
# ======================================================================

bots:
  # -- Bot A: Baseline Contrarian EV (trades most often — the benchmark) --
  bot_a_contrarian:
    strategy: contrarian_ev
    enabled: false   # Retired — poor WR in ranging, net negative PnL
    db_path: ./data_runtime/bot_a_contrarian.db
    # Flip signal direction on Sat/Sun — weekend markets are more efficient,
    # the cheap side is cheap for a reason. Data shows 79% inverse WR.
    weekend_flip: true

    # MTF Regime Detector — calibrated via walk-forward (21 folds, 2yr data)
    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      # Bot A affinity: contrarian works best in trending_down (43.7% WR, +$29)
      # Sits out high_vol entirely (29.4% WR, -$82)
      allowed_regimes: [trending_up, trending_down, ranging]
      block_regimes: [high_vol, low_vol]

    signals:
      oracle_lag:
        max_expected_lag: 0.001
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      max_adjustment: 0.20

    entry:
      # Edge thresholds are now in probability units (how much model
      # disagrees with market). Kept low so Bot A trades frequently
      # like the original profitable strategy (~100+ trades/day).
      min_edge: 0.01
      max_edge: 0.06
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduce_at: 3
      streak_reduce_factor: 0.75
      streak_heavy_reduce_at: 5
      streak_heavy_reduce_factor: 0.5
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5

  # -- Bot C: HMM Regime EV (only trades during trending regimes) --
  bot_c_hmm_regime:
    strategy: hmm_regime_ev
    enabled: false   # Retired — insufficient edge
    db_path: ./data_runtime/bot_c_hmm_regime.db
    weekend_flip: true

    # Bot C keeps its own HMM regime detector (not MTF) — it's the
    # comparison point. The HMM filter already restricts to trending only.
    regime:
      detector: hmm
      # HMM-specific: Bot C's own classifier handles regime gating

    signals:
      oracle_lag:
        max_expected_lag: 0.001
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      hmm_regime:
        transition_stickiness: 0.90
        adaptation_rate: 0.02
        min_candles: 16
        feature_lookback: 5
      max_adjustment: 0.20

    entry:
      # Same base thresholds as Bot A — the regime filter is what
      # makes Bot C different, not higher thresholds.
      min_edge: 0.01
      max_edge: 0.06
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005
      # HMM-specific: only enter during trending regimes
      only_trending: true
      min_regime_confidence: 0.40

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduce_at: 3
      streak_reduce_factor: 0.75
      streak_heavy_reduce_at: 5
      streak_heavy_reduce_factor: 0.5
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5

  # -- Bot B: Kalman Filter EV (selective — requires velocity confirmation) --
  bot_b_kalman:
    strategy: kalman_ev
    enabled: false   # Retired — 28% WR, -$297 over 630 trades
    db_path: ./data_runtime/bot_b_kalman.db
    weekend_flip: true

    # MTF Regime: Bot B loses in ALL regimes, but least in trending_down.
    # Block high_vol and low_vol. Require stronger alignment for entry.
    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      allowed_regimes: [trending_up, trending_down]
      block_regimes: [high_vol, low_vol, ranging]

    signals:
      kalman_filter:
        # OPTIMISED 2026-04-08: process_noise tightened (was 1e-5),
        # oracle noise tightened (was 5e-4). Smoother state, trusts
        # oracle more. Walk-forward OOS Sharpe +16.55, PnL +$292.
        process_noise_scale: 5.0e-6
        measurement_noise_binance: 1.0e-4
        measurement_noise_coinbase: 2.0e-4
        measurement_noise_oracle: 2.0e-4
        adaptive_window: 30
        breakout_velocity_threshold: 0.5
        max_expected_lag: 0.001
        velocity_confidence_boost: 1.15
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      max_adjustment: 0.20
      # KF-dominant weight schedule — L1 Kalman gets 35-45% weight
      # instead of the default 10-25%. This makes the KF the primary
      # signal driver, not just a small contributor.
      weight_schedule: kf_dominant

    entry:
      # OPTIMISED 2026-04-08: raised min_edge (was 0.02) and
      # min_confidence (was 0.03) — more selective, only trades
      # when the KF signal is strong. Cuts noise trades.
      min_edge: 0.03
      max_edge: 0.08
      fee_adjustment: 0.02
      min_confidence: 0.05
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005
      # KF-specific: require velocity to confirm trade direction
      require_velocity_confirm: true

    sizing:
      # OPTIMISED 2026-04-08: raised kelly (was 0.25) — size up
      # when the optimised signal is confident.
      kelly_multiplier: 0.35
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduce_at: 3
      streak_reduce_factor: 0.75
      streak_heavy_reduce_at: 5
      streak_heavy_reduce_factor: 0.5
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5

  # -- Bot D: Enhanced EV (improved signals — fork of Bot A) --
  bot_d_enhanced:
    strategy: enhanced_ev
    enabled: false   # Retired — net negative PnL
    db_path: ./data_runtime/bot_d_enhanced.db
    weekend_flip: true

    # MTF Regime: Bot D profitable in trending_down (46.8% WR, +$44).
    # Marginal in ranging (-$33), terrible in high_vol (-$77).
    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      # 2026-05-14: high_vol unblocked. Backtest on 27.6h of diagnostic
      # data (128 simulated trades) showed high_vol would have been MORE
      # profitable than ranging (62.5% WR, +$1.04/trade, Sharpe 0.33).
      # Natural throttles still apply: edge_multiplier 1.8 and
      # size_multiplier 0.5 from REGIME_PARAMS in regime_detector.py.
      # low_vol stays blocked (edge_multiplier 999 makes it dead anyway).
      # See backtest/high_vol_regime_validation.py.
      allowed_regimes: [trending_up, trending_down, ranging, high_vol]
      block_regimes: [low_vol]

    signals:
      oracle_lag:
        max_expected_lag: 0.001
      momentum_slope:
        weight_30s: 0.35
        weight_60s: 0.30
        weight_120s: 0.20
        weight_240s: 0.15
        slope_normaliser: 10.0
      cross_exchange:
        rolling_window: 120
        z_threshold: 1.5
        max_spread_usd: 200.0
      funding_filter:
        mild_threshold: 0.01
        high_threshold: 0.05
        stress_threshold: 0.10
      max_adjustment: 0.20

    entry:
      min_edge: 0.01
      max_edge: 0.06
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduce_at: 3
      streak_reduce_factor: 0.75
      streak_heavy_reduce_at: 5
      streak_heavy_reduce_factor: 0.5
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5

  # -- Bot E: OU Mean Reversion (trades Binance-Oracle spread reversion) --
  bot_e_ou_reversion:
    strategy: ou_reversion_ev
    enabled: false   # Retired — net negative PnL
    db_path: ./data_runtime/bot_e_ou_reversion.db
    weekend_flip: true

    # MTF Regime: Bot E best performer in trending_down (51.5% WR, +$69).
    # OU reversion shines when there's a clear trend to revert to.
    # Block high_vol (too noisy for mean reversion) and low_vol (no edge).
    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      allowed_regimes: [trending_up, trending_down]
      block_regimes: [high_vol, low_vol, ranging]

    signals:
      ou_spread:
        calibration_window: 300
        min_observations: 60
        entry_z_threshold: 1.5
        dt: 1.0
      momentum_slope:
        weight_30s: 0.35
        weight_60s: 0.30
        weight_120s: 0.20
        weight_240s: 0.15
        slope_normaliser: 10.0
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      max_adjustment: 0.20

    entry:
      min_edge: 0.01
      max_edge: 0.06
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005
      # OU-specific: require minimum z-score before considering entry
      min_ou_z_score: 1.5

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduce_at: 3
      streak_reduce_factor: 0.75
      streak_heavy_reduce_at: 5
      streak_heavy_reduce_factor: 0.5
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5

  # -- Bot G: Signal-Aligned Contrarian (replaces standalone main.py) --
  # Same signal engine as Bot A but follows signal direction in ranging
  # markets instead of fading the market. Uses main.py's tighter edge
  # thresholds. Shares feeds with all other bots via multi_runner.
  bot_g_signal_aligned:
    strategy: contrarian_ev
    enabled: false   # Decommissioned 2026-06-01 — first confirmed-edge bot, retired; Bot K is the go-live candidate. Final +$239. Historical data retained.
    db_path: ./data_runtime/bot_g_signal_aligned.db
    weekend_flip: true

    # Per-tick signal diagnostic logger (2026-05-13). Captures every tick's
    # full signal state to data_runtime/<bot>_signal_diag.db for offline
    # analysis. Enabled to diagnose the 100% YES bias issue (see decisions
    # J9 to be added once root cause confirmed). Disable by setting
    # enabled: false. Sample_every_n=1 logs every tick (~2/sec).
    signal_diagnostic:
      enabled: true
      sample_every_n: 1

    # Data-driven filters from 1,321-trade review (Apr 14-24):
    # - YES bets < $0.40: lost $157 over 611 trades
    # - trending_down regime: 34% WR (below break-even), -$69 total
    # High-EV early-window filter (added 2026-05-13, backtest commit bacc760):
    # - Skipping EV>=0.15 trades at 0-60s into window saves -$213 PnL on
    #   Bot G's historical data while preserving the late high-EV winners
    #   (50 trades, +$171). Mechanism: early-window high-EV signals are
    #   noisy (no momentum history, orderbook unsettled).
    filters:
      yes_min_price: 0.40
      skip_regimes: [trending_down]
      high_ev_threshold: 0.15
      high_ev_min_secs_into_window: 60.0

    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      # 2026-05-14: high_vol unblocked. Backtest on 27.6h of diagnostic
      # data (128 simulated trades) showed high_vol would have been MORE
      # profitable than ranging (62.5% WR, +$1.04/trade, Sharpe 0.33).
      # Natural throttles still apply: edge_multiplier 1.8 and
      # size_multiplier 0.5 from REGIME_PARAMS in regime_detector.py.
      # low_vol stays blocked (edge_multiplier 999 makes it dead anyway).
      # See backtest/high_vol_regime_validation.py.
      allowed_regimes: [trending_up, trending_down, ranging, high_vol]
      block_regimes: [low_vol]

    signals:
      oracle_lag:
        max_expected_lag: 0.001
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      max_adjustment: 0.20

    entry:
      min_edge: 0.003
      max_edge: 0.025
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduce_at: 3
      streak_reduce_factor: 0.75
      streak_heavy_reduce_at: 5
      streak_heavy_reduce_factor: 0.5
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5

  # -- Bot K: Signal-Aligned + Enhanced Risk Management --
  # Fork of Bot G with walk-forward optimised signal weights + enhanced risk:
  # Signal changes (backtest: +180 PnL improvement OOS, 7/7 folds beat default):
  # - Core weight schedule "bot_k_optimised": momentum-dominant (L2 ~0.38-0.42)
  # - Oracle (L1) reduced from 0.20 → 0.11 at 180s (was over-weighted)
  # - Orderbook (L4) boosted from 0.23 → 0.24 at 180s
  # - Taker ratio (L7) boosted from 0.08 → 0.131
  # - L9b-L12 enabled at conservative 0.05 (absorption, exhaustion, trade_size, wallet_flow)
  # Risk management (validated via backtest):
  # - No streak size reduction (backtest showed it punishes normal variance)
  # - BTC distance stop at $100 (91% helped rate, +$74 over 2,263 trades)
  # - Drawdown breaker at 30% from peak
  # - Daily trade cap at 150
  # - Regime sizing: 1.5x in ranging, 0.75x in trending_up
  # L9 SM confirmation disabled (too sparse data to be useful).
  # Run alongside Bot G to compare performance with/without these changes.
  bot_k_sm_confirmation:
    strategy: contrarian_ev
    enabled: true
    db_path: ./data_runtime/bot_k_sm_confirmation.db
    weekend_flip: true
    # T1 probe (ADR-0003): flip to "live" ONLY after the pre-live CSO
    # re-run and the go/no-go grill. Startup guards: requires CLOB auth
    # in .env; at most one live bot in the fleet.
    execution_mode: paper

    # Per-tick signal diagnostic logger (2026-05-13). Captures every tick's
    # full signal state. Both Bot G and Bot K log so we can compare the
    # signal computation across the two bots side-by-side.
    signal_diagnostic:
      enabled: true
      sample_every_n: 1

    # L9: SM Confirmation Layer — disabled (data too sparse, always IGNORE)
    sm_confirmation:
      enabled: false

    # Same filters as Bot G (including high-EV early-window filter added 2026-05-13)
    filters:
      yes_min_price: 0.40
      skip_regimes: [trending_down]
      high_ev_threshold: 0.15
      high_ev_min_secs_into_window: 60.0

    # Same regime as Bot G (with 2026-05-14 high_vol unblock).
    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      # 2026-05-14: high_vol unblocked (see decisions_BTC J10 and Bot G
      # for full rationale and backtest evidence).
      allowed_regimes: [trending_up, trending_down, ranging, high_vol]
      block_regimes: [low_vol]

    # Signals — walk-forward optimised core weights (7/7 folds beat default)
    # Backtest: 13,867 markets, +180.24 PnL improvement OOS vs Bot G defaults.
    # Key finding: momentum (L2) is dominant signal, oracle (L1) was over-weighted.
    # L9b-L12 at conservative 0.05 (no backtest data available for these).
    signals:
      weight_schedule: bot_k_optimised  # momentum-dominant schedule
      # 2026-05-14: opt out of the ranging-regime override. Without this,
      # ranging regime would clobber bot_k_optimised with the "ranging"
      # schedule (L4-dominant), defeating the walk-forward optimisation.
      # See decisions_BTC J11.
      use_ranging_override: false
      oracle_lag:
        max_expected_lag: 0.001
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      max_adjustment: 0.195            # optimised (was 0.20)
      taker_ratio_weight: 0.131        # L7 optimised (was 0.08)
      # L9b-L12: conservative defaults (no backtest data, start small)
      absorption_weight: 0.05          # L9b: orderbook absorption detection
      exhaustion_weight: 0.05          # L10: level exhaustion patterns
      trade_size_weight: 0.05          # L11: trade size conviction
      wallet_flow_weight: 0.05         # L12: on-chain wallet flow
      # J13 directional signal gating (2026-05-21): when |L1| > gate_threshold,
      # clamp L4 mid_dev/top_pressure + L7 taker_ratio so they can amplify L1
      # but never contradict it. Symmetric across bullish/bearish L1.
      # Past-7d backtest (1121 ticks): suppresses 137 NO trades (88% losers,
      # +$205 saved), 0 YES trades affected adversely. See decisions_BTC J13.
      # Bot G intentionally NOT enabled — A/B comparison preserved.
      directional_signal_gating: true
      gate_threshold: 0.4

    entry:
      min_edge: 0.003
      max_edge: 0.025
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0
      # Wallet-proportional sizing (revised 2026-06-12, ADR-0003 / J30):
      # max risk/trade = 4% of min(wallet,$200); min risk/trade = the
      # dynamic exchange minimum (5*price) below $200, flat $5 at/above.
      # Kelly bumps up to the floor (trade tagged size_bumped); skips if
      # the floor can't fit under the ceiling. Paper wallet persists across
      # restarts: bankroll = initial + PnL since bankroll_epoch.
      wallet_proportional: true
      ceiling_pct: 0.04            # max risk/trade = 4% of wallet: $4@$100, $8@$200, flat above
      wallet_cap_usdc: 200.0
      min_order_shares: 5.0        # below $200 the floor = 5*price (the exchange minimum)
      floor_at_cap_usdc: 5.0       # at/above $200 the floor is a flat $5
      bankroll_epoch: "2026-06-11T13:00:00+00:00"

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      # Streak reduction DISABLED — backtest showed win rate at 5 losses
      # is actually 48.1% (highest), so reducing size punishes normal
      # variance and costs money.
      streak_reduction_enabled: false
      streak_pause_at: 7            # keep the circuit breaker for extreme streaks
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5
      # BTC distance stop — exit when BTC moves $90+ against us vs
      # window open. Original backtest: dist=$100, min_rem=60s → 91%
      # helped, +$74.20 over 2,263 trades. Tightened 100→90 on
      # 2026-06-11 (user risk preference pre-go-live): $75-$95 sweep
      # showed all thresholds EV-neutral within noise; tighter trigger
      # offsets the $0-30 polling-latency overshoot recorded in
      # EARLY_EXIT tags. See backtest/btc_distance_stop_replay.py.
      btc_distance_stop: 90.0
      btc_distance_min_secs_remaining: 60.0
      # Drawdown breaker — pause all trading if bankroll drops 30%
      # from peak. Prevents catastrophic spirals.
      drawdown_pct: 0.30
      # Daily trade cap — 150 trades max per UTC day.
      daily_trade_cap: 150
      # Regime sizing — size up in ranging (where contrarian edge is
      # strongest) and reduce in trending_up (marginal edge).
      regime_size_overrides:
        ranging: 1.5
        trending_up: 0.75

  # -- Bot K2: Bot K + directional L1 floor (A/B test, 2026-05-29) --
  # Byte-for-byte clone of bot_k_sm_confirmation with ONE change: the
  # directional L1 floor enabled. Runs paper alongside Bot K to measure the
  # floor's INCREMENTAL value on top of J13 + optimised weights (the
  # backtest engine lacks J13, so it can't give the faithful number).
  # Hypothesis (BTC_5min_Observations 2026-05-29 "L1 directional leak"):
  # the bot leaks betting against the window-open resolution line — YES
  # while L1<0 (price below line), NO while L1>0 (above). The floor blocks
  # those entries beyond a deadband. Independent Mar-Apr backtest: flipped
  # per-trade EV -0.0096 -> +0.0280, WR 35.6% -> 50.8%. YES side is the
  # genuinely-incremental piece (J13 doesn't touch YES); NO mostly overlaps
  # J13 but the floor closes its residual. Bot K config is UNCHANGED — it is
  # the A/B baseline. Do not evaluate before ~week 2.
  bot_k2_l1_floor:
    strategy: contrarian_ev
    enabled: true
    db_path: ./data_runtime/bot_k2_l1_floor.db
    weekend_flip: true

    signal_diagnostic:
      enabled: true
      sample_every_n: 1

    sm_confirmation:
      enabled: false

    # Same filters as Bot K, PLUS the directional L1 floor (the only change).
    filters:
      yes_min_price: 0.40
      skip_regimes: [trending_down]
      high_ev_threshold: 0.15
      high_ev_min_secs_into_window: 60.0
      # Directional L1 floor (2026-05-29): block entries that bet against the
      # window-open resolution line beyond the deadband. YES needs L1>=-0.1,
      # NO needs L1<=+0.1. Deadband 0.1 absorbs price-feed noise near zero
      # (3-feed aggregate vs window-open ref) AND keeps the mildly-against
      # reversion winners (profitable in mean-reverting regimes). Do NOT
      # tighten toward 0 — that would block those winners. May widen if the
      # floor hurts in mean-reversion. The floor is regime-conditional
      # insurance: helps in directional regimes, can hurt in mean-reversion.
      directional_l1_floor: true
      directional_l1_floor_deadband: 0.1

    regime:
      detector: mtf
      trend_threshold: 0.30
      high_vol_percentile: 0.90
      low_vol_percentile: 0.20
      alignment_weight: 0.55
      stickiness: 3
      allowed_regimes: [trending_up, trending_down, ranging, high_vol]
      block_regimes: [low_vol]

    signals:
      weight_schedule: bot_k_optimised
      use_ranging_override: false
      oracle_lag:
        max_expected_lag: 0.001
      momentum:
        roc_weight: 0.30
        direction_weight: 0.25
        volume_weight: 0.25
        body_ratio_weight: 0.10
        rsi_weight: 0.10
        rsi_period: 5
        lookback_candles: 10
      max_adjustment: 0.195
      taker_ratio_weight: 0.131
      absorption_weight: 0.05
      exhaustion_weight: 0.05
      trade_size_weight: 0.05
      wallet_flow_weight: 0.05
      directional_signal_gating: true
      gate_threshold: 0.4

    entry:
      min_edge: 0.003
      max_edge: 0.025
      fee_adjustment: 0.02
      min_confidence: 0.02
      preferred_entry_secs: 180
      latest_entry_secs: 60
      earliest_entry_secs: 270
      fok_slippage: 0.005

    sizing:
      kelly_multiplier: 0.25
      min_bet_usdc: 1.0
      max_bet_usdc: 5.0
      initial_bankroll: 100.0
      # Wallet-proportional sizing — identical to Bot K (A/B requires
      # both bots on the same sizing scheme). See Bot K block for spec.
      wallet_proportional: true
      ceiling_pct: 0.04            # max risk/trade = 4% of wallet: $4@$100, $8@$200, flat above
      wallet_cap_usdc: 200.0
      min_order_shares: 5.0        # below $200 the floor = 5*price (the exchange minimum)
      floor_at_cap_usdc: 5.0       # at/above $200 the floor is a flat $5
      bankroll_epoch: "2026-06-11T13:00:00+00:00"

    risk:
      daily_loss_cap_pct: 0.20
      daily_loss_warn_pct: 0.15
      min_bankroll: 10.0
      streak_reduction_enabled: false
      streak_pause_at: 7
      streak_pause_minutes: 30
      streak_reset_wins: 3
      low_volatility_threshold: 0.0001
      high_volatility_threshold: 0.02
      high_volatility_size_factor: 0.5
      # Tightened 100→90 on 2026-06-11, identical to Bot K (A/B fairness).
      btc_distance_stop: 90.0
      btc_distance_min_secs_remaining: 60.0
      drawdown_pct: 0.30
      daily_trade_cap: 150
      regime_size_overrides:
        ranging: 1.5
        trending_up: 0.75

